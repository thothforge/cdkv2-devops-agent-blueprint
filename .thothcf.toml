[thothcf]
project_id = "devops-agent-blueprint"
project_type = "cdkv2-typescript"
space = "bco"

[origin_metadata]
template_url = "https://github.com/thothforge/cdkv2_typescript_scaffold.git"
template_type = "cdkv2-typescript"
commit_hash = "797a3499af7ea76844d5aac3d17b6f58d464ae07"
commit_date = "2026-07-27T23:52:01-05:00"
source = "github_default_template"
cloned_at = "2026-08-05T16:37:28.673567"

[template_input_parameters.project_name]
template_value = "MyProject"
condition = "^[a-zA-Z0-9\\-]+$"
description = "Project Name"

[template_input_parameters.deployment_region]
template_value = "us-east-1"
condition = "^[a-z]{2}-[a-z]{4,10}-\\d$"
description = "AWS Region"

[template_input_parameters.owner]
template_value = "platform-team"
condition = "^[a-zA-Z0-9\\-]+$"
description = "Team or role owner"

[template_input_parameters.environment]
template_value = "dev"
condition = "(dev|qa|stg|prd)"
description = "Target environment"

[template_input_parameters.dev_account_id]
template_value = "111111111111"
condition = "^\\d{12}$"
description = "AWS Account ID for dev environment"

[template_input_parameters.qa_account_id]
template_value = "222222222222"
condition = "^\\d{12}$"
description = "AWS Account ID for QA environment"

[template_input_parameters.prd_account_id]
template_value = "333333333333"
condition = "^\\d{12}$"
description = "AWS Account ID for production environment"

[template_input_parameters.pipeline_mode]
template_value = "github-actions"
condition = "(cdk-pipelines|github-actions|azure-devops|none)"
description = "CI/CD pipeline mode: cdk-pipelines (self-mutating CodePipeline), github-actions, azure-devops, or none"

[template_input_parameters.pipeline_account]
template_value = "111111111111"
condition = "^\\d{12}$"
description = "AWS account ID where CDK Pipeline stack is deployed (used only with cdk-pipelines mode)"

[template_input_parameters.vcs_provider]
template_value = "github"
condition = "(github|github-enterprise|bitbucket|gitlab)"
description = "VCS provider for CodeConnections (used only with cdk-pipelines mode)"

[template_input_parameters.codestar_connection_arn]
template_value = ""
condition = "^(arn:aws:codeconnections:[a-z0-9-]+:\\d{12}:connection/[a-f0-9-]+|arn:aws:codestar-connections:[a-z0-9-]+:\\d{12}:connection/[a-f0-9-]+|)$"
description = "AWS CodeConnections ARN (required for cdk-pipelines mode, create via Console)"

[template_input_parameters.repo_owner]
template_value = "my-org"
condition = "^[a-zA-Z0-9\\-_.]+$"
description = "Repository owner/organization"

[template_input_parameters.repo_name]
template_value = "my-infra"
condition = "^[a-zA-Z0-9\\-_.]+$"
description = "Repository name"

[context_sources]
description = "Architecture/OpenSpec definition files for Kiro steering docs"
target = ".kiro/steering"
supported_extensions = [".md", ".yaml", ".yml", ".txt"]
