project_name: "#{project_name}#"

# Pipeline configuration
# mode: cdk-pipelines | github-actions | azure-devops | none
pipeline:
  mode: "#{pipeline_mode}#"
  # CDK Pipelines settings (required when mode = cdk-pipelines)
  cdk_pipelines:
    # AWS CodeConnections (formerly CodeStar Connections) ARN
    # Create via Console: Developer Tools > Settings > Connections > Create connection
    # Must be in AVAILABLE status (requires manual one-time OAuth handshake with VCS provider)
    connection_arn: "#{codestar_connection_arn}#"
    # VCS provider: github | github-enterprise | bitbucket | gitlab
    provider: "#{vcs_provider}#"
    repo: "#{repo_owner}#/#{repo_name}#"
    branch: "main"
    self_mutating: true
  # Account/region where the pipeline itself is deployed (tooling/devsecops account)
  # This is also where Agent Spaces are deployed (hub model)
  pipeline_account: "#{pipeline_account}#"
  pipeline_region: "#{deployment_region}#"
  # Deployment wave ordering (deploys AgentAccessRole to target accounts)
  deploy_order:
    - environment: dev
      manual_approval: false
    - environment: qa
      manual_approval: true
    - environment: prd
      manual_approval: true

environments:
  dev:
    account: "#{dev_account_id}#"
    region: "#{deployment_region}#"
  qa:
    account: "#{qa_account_id}#"
    region: "#{deployment_region}#"
  prd:
    account: "#{prd_account_id}#"
    region: "#{deployment_region}#"

tags:
  Project: "#{project_name}#"
  ManagedBy: "CDK"
  Owner: "#{owner}#"

# ──────────────────────────────────────────────────────────────────────────────
# AWS DevOps Agent Configuration — Hub Model
# ──────────────────────────────────────────────────────────────────────────────
# Agent Spaces are deployed in the pipeline/devsecops account (hub).
# Target accounts only receive a lightweight IAM role for cross-account access.
#
# Architecture:
#   Pipeline Account (devsecops):
#     ├── Agent Space "NonProd" → monitors dev + qa
#     └── Agent Space "Prod"    → monitors prd
#
#   Target Accounts:
#     └── AgentAccessRole (IAM role assumed by the Agent Space)
#
# This follows AWS best practice: "one Agent Space per on-call team"
# separating production from non-production environments.
# ──────────────────────────────────────────────────────────────────────────────

agent_spaces:
  - name: "#{project_name}#-nonprod"
    description: "DevOps Agent Space for non-production environments (dev + qa)"
    tier: "nonprod"
    # Language of agent responses (BCP-47). Optional — omit for English default.
    # Examples: "en", "es", "es-ES", "pt-BR", "ja". Can be changed later without
    # replacing the Agent Space.
    # locale: "es"
    # Accounts this Agent Space monitors (cross-account associations)
    monitored_accounts:
      - environment: dev
        account_id: "#{dev_account_id}#"
        regions:
          - "#{deployment_region}#"
      - environment: qa
        account_id: "#{qa_account_id}#"
        regions:
          - "#{deployment_region}#"

  - name: "#{project_name}#-prod"
    description: "DevOps Agent Space for production environment"
    tier: "prod"
    monitored_accounts:
      - environment: prd
        account_id: "#{prd_account_id}#"
        regions:
          - "#{deployment_region}#"
        # Optional: scope the topology crawl to a specific workload.
        # Only resources carrying ALL these tags are discovered.
        # scope_tags:
        #   "aws:cloudformation:stack-name": "MyApp-production"

