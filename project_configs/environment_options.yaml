project_name: "devops-agent-blueprint"

environments:
  dev:
    account: "111111111111"
    region: "us-east-1"
  qa:
    account: "222222222222"
    region: "us-east-1"
  prd:
    account: "333333333333"
    region: "us-east-1"

tags:
  Project: "devops-agent-blueprint"
  ManagedBy: "CDK"
  Owner: "platform-team"

# AWS DevOps Agent configuration
devops_agent:
  space_name: "devops-agent-blueprint"
  space_description: "DevOps Agent Space for production operations and release management"
  # AWS accounts the agent can investigate (multi-account)
  monitored_accounts:
    - account_id: "111111111111"
      role_arn: "arn:aws:iam::111111111111:role/DevOpsAgentAccessRole"
      regions:
        - "us-east-1"
