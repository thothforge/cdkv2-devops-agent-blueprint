project_name: "#{project_name}#"

environments:
  dev:
    account: "#{dev_account_id}#"
    region: "#{deployment_region}#"
  qa:
    account: "#{qa_account_id}#"
    region: "#{deployment_region}#"
  prd:
    account: "#{prd_account_id}#"
    region: "#{deployment_region}#"

tags:
  Project: "#{project_name}#"
  ManagedBy: "CDK"
  Owner: "#{owner}#"

# AWS DevOps Agent configuration
devops_agent:
  space_name: "#{project_name}#"
  space_description: "DevOps Agent Space for production operations and release management"
  # AWS accounts the agent can investigate (multi-account)
  monitored_accounts:
    - account_id: "#{dev_account_id}#"
      role_arn: "arn:aws:iam::#{dev_account_id}#:role/DevOpsAgentAccessRole"
      regions:
        - "#{deployment_region}#"
  # MCP server integrations (non-OAuth)
  # mcp_servers:
  #   - service_type: "mcpserver"
  #     name: "custom-runbooks-mcp"
  #     target_url: "https://mcp.internal.example.com"
  #     private_connection_name: "internal-mcp"
  #   - service_type: "mcpserversplunk"
  #     name: "splunk-integration"
  #     target_url: "https://splunk.internal.example.com:8089"
  #   - service_type: "mcpservergrafana"
  #     name: "grafana-integration"
  #     target_url: "https://grafana.internal.example.com"
  # Private connection (uncomment to enable VPC connectivity for MCP servers)
  # private_connection:
  #   name: "internalmcp"
  #   host_address: "10.0.1.50"
  #   vpc_id: "vpc-0123456789abcdef0"
  #   subnet_ids:
  #     - "subnet-0123456789abcdef0"
  #     - "subnet-0123456789abcdef1"
  #   security_group_ids:
  #     - "sg-0123456789abcdef0"
